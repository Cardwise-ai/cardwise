[project]
name = "cardwise-llm"
version = "0.1.0"
description = "Provider-agnostic chat model port, adapters and test doubles"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx2>=2.16,<3",
    "openai>=3.57,<4",
    "pydantic>=2.14,<3",
    "pydantic-ai-slim[google,openai]>=2.71,<3",
    "tzdata>=2026.6",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"
