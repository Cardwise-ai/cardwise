[project]
name = "cardwise-evals"
version = "0.1.0"
description = "Retrieval and answer evaluations"
requires-python = ">=3.12,<3.13"
dependencies = ["cardwise-core", "cardwise-llm", "pydantic>=2.14,<3"]

[tool.uv.sources]
cardwise-core = { workspace = true }
cardwise-llm = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"
