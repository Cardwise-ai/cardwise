[project]
name = "cardwise-workspace"
version = "0.0.0"
requires-python = ">=3.12,<3.13"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "api", "ingest", "evals"]

[tool.uv.sources]
cardwise-core = { workspace = true }
cardwise-llm = { workspace = true }
cardwise-api = { workspace = true }
cardwise-ingest = { workspace = true }
cardwise-evals = { workspace = true }

[dependency-groups]
dev = [
    "cardwise-core",
    "cardwise-llm",
    "cardwise-api",
    "cardwise-ingest",
    "cardwise-evals",
    "asyncpg>=0.32,<0.33",
    "asyncpg-stubs>=0.32",
    "httpx>=0.28,<0.29",
    "mypy>=2.4,<2.5",
    "pre-commit>=4",
    "pytest>=9.2,<10",
    "pytest-asyncio>=1.5,<2",
    "ruff>=0.17.6,<0.18",
    "boto3-stubs[s3]>=1.44.9",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages/core/src", "packages/llm/src", "api/src", "ingest/src", "evals/src"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "S", "ASYNC",
    "PT", "TID", "ERA", "PTH", "RET", "DTZ", "T20", "BLE", "FBT", "ANN",
]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "ANN", "FBT"]
# Operator scripts talk to a terminal.
"scripts/**" = ["T201"]
# Vendor SDKs may only be imported inside the LLM adapters (see docs/adr/0003).
"packages/llm/src/cardwise_llm/adapters/**" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pydantic_ai".msg = "Import model providers only inside cardwise_llm.adapters."
"openai".msg = "Import model providers only inside cardwise_llm.adapters."
"anthropic".msg = "Import model providers only inside cardwise_llm.adapters."
"google.genai".msg = "Import model providers only inside cardwise_llm.adapters."
"litellm".msg = "LiteLLM is not used (docs/adr/0003)."

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
mypy_path = ["packages/core/src", "packages/llm/src", "api/src", "ingest/src", "evals/src"]
explicit_package_bases = true
files = ["packages", "api", "ingest", "evals", "scripts", "supabase/tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--strict-markers", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["packages/core/tests", "packages/llm/tests", "api/tests", "ingest/tests", "supabase/tests"]
markers = [
    "db: needs the local Supabase database (supabase db start)",
    "live: calls a real model provider; needs API keys",
]
