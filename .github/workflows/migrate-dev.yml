name: migrate-dev

# Prod gets migrations from the Supabase GitHub integration on push to main. The dev project
# has no integration, so this applies the same migrations to it.

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: dev
    concurrency:
      group: migrate-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.2.0
      - name: Push migrations
        env:
          DATABASE_URL: ${{ secrets.CARDWISE_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::CARDWISE_DATABASE_URL is not set in the dev environment"
            exit 1
          fi
          supabase db push --remote="$DATABASE_URL" --yes
