# Model chain for the chat assistant, tried in order (see cardwise_llm.resilient for the rules).
# No secrets here: each provider's key comes from the environment
# (CARDWISE_GEMINI_API_KEY, CARDWISE_OPENROUTER_API_KEY, or the entry's api_key_env).
#
# Optional per-model budgets. Leave a cap out for no local limit:
#   daily_request_cap, minute_request_cap, daily_token_cap, day_resets_in (IANA zone)
# Gemini's free tier resets at midnight Pacific time. Its per-model limits differ by project:
# copy them from https://aistudio.google.com/rate-limit before setting caps.

[policy]
max_attempts = 2       # attempts per model, the first included
base_delay_s = 0.5     # full-jitter backoff base
max_delay_s = 8.0
max_retry_after_s = 20 # a longer Retry-After moves on to the next model instead of waiting

[[chain]]
provider = "gemini"
model = "gemini-3.5-flash-lite"
timeout_s = 45
day_resets_in = "America/Los_Angeles"

[[chain]]
provider = "gemini"
model = "gemini-3.1-flash-lite"
timeout_s = 45
day_resets_in = "America/Los_Angeles"

# OpenRouter free models: 20 requests/minute and 50/day per account without purchased credits;
# the daily cap is shared by all :free models, so keep the sum of their caps under it.
# Popular free models are often rate-limited upstream (shared pool); the chain then moves on.
[[chain]]
provider = "openrouter"
model = "nvidia/nemotron-3.5-super-vl:free"
timeout_s = 60
daily_request_cap = 45
minute_request_cap = 18

