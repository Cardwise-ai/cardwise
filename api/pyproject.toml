[project]
name = "cardwise-api"
version = "0.1.0"
description = "Cardwise HTTP API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cardwise-core",
    "cardwise-llm",
    "fastapi>=0.165,<0.166",
    "pydantic>=2.14,<3",
]

[tool.uv.sources]
cardwise-core = { workspace = true }
cardwise-llm = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"
