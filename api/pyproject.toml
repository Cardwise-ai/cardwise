[project]
name = "cardwise-api"
version = "0.1.0"
description = "Cardwise HTTP API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anyio>=4.16,<5",
    "asyncpg>=0.32,<0.33",
    "cardwise-core",
    "cardwise-llm",
    "fastapi>=0.165,<0.166",
    "httpx>=0.28,<0.29",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "pyjwt[crypto]>=2.15,<3",
]

[tool.uv.sources]
cardwise-core = { workspace = true }
cardwise-llm = { workspace = true }

# Vercel project `cardwise-api` (root directory `api`) loads `app` from api/index.py,
# which re-exports cardwise_api.main:app. Function settings are in vercel.json.
[tool.vercel]
entrypoint = "index:app"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
