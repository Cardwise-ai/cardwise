[project]
name = "cardwise-ingest"
version = "0.1.0"
description = "Scryfall and Tagger import into the card corpus"
requires-python = ">=3.12,<3.13"
dependencies = ["cardwise-core", "pydantic>=2.14,<3"]

[tool.uv.sources]
cardwise-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"
